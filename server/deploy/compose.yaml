name: kupo-skribbl
services:
  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  game:
    build: .
    restart: unless-stopped
    # Sharing the proxy's network lets the backend stay on loopback. Only the
    # proxy's HTTPS/ACME ports are published to the internet.
    network_mode: "service:proxy"
    depends_on: [proxy]
    volumes:
      - accounts:/var/lib/kupopop
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  accounts:
  certificates:
  proxy_config:
