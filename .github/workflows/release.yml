name: Build and publish experimental release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'plugin/releases/repo.json', 'plugin/releases/testing.zip']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kupopop-release
  cancel-in-progress: false
jobs:
  build:
    needs: linux-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Get official Dalamud assemblies
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'dalamud'
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          Expand-Archive "$env:RUNNER_TEMP/dalamud.zip" $folder
          "DALAMUD_HOME=$folder" >> $env:GITHUB_ENV
      - name: Build and run game/protocol tests
        shell: pwsh
        run: |
          dotnet build server/Kupopop.Tests/Kupopop.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet server/Kupopop.Tests/bin/Release/net10.0/Kupopop.Tests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build plugin and self-contained servers
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File server/Test-ServerTools.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Build-Release.ps1
      - name: Verify packaged Windows TLS server
        shell: pwsh
        run: |
          dotnet server/Kupopop.Tests/bin/Release/net10.0/Kupopop.Tests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish testing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content artifacts/repo.json -Raw | ConvertFrom-Json
          $tag = 'v' + (($manifest[0].AssemblyVersion -split '\.')[0..2] -join '.')
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --prerelease --title "Kupopop Draw $tag - experimental" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag artifacts/testing.zip artifacts/repo.json artifacts/Kupopop.Server-win-x64.zip artifacts/Kupopop.Server-linux-x64.zip --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify download and publish installer feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = (Get-Content artifacts/repo.json -Raw | ConvertFrom-Json)[0]
          $download = Join-Path $env:RUNNER_TEMP 'verified-testing.zip'
          Invoke-WebRequest $manifest.DownloadLinkInstall -OutFile $download
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($download)
          try {
            $entry = $archive.GetEntry('Kupopop.json')
            if (-not $entry) { throw 'Published ZIP has no plugin manifest.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $published = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if ($published.AssemblyVersion -ne $manifest.AssemblyVersion -or $published.DalamudApiLevel -ne $manifest.DalamudApiLevel) { throw 'Published ZIP does not match the feed.' }
          } finally { $archive.Dispose() }
          $endpoint = "repos/$env:GITHUB_REPOSITORY/contents/plugin/releases/repo.json"
          $current = gh api $endpoint | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $existing = ([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($current.content)) | ConvertFrom-Json)[0]
          if ([version]$existing.AssemblyVersion -gt [version]$manifest.AssemblyVersion) { Write-Host 'A newer feed is already published.'; exit 0 }
          $payload = @{ message="Publish verified installer feed $($manifest.AssemblyVersion)"; branch='main'; sha=$current.sha; content=[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD 'artifacts/repo.json'))) }
          $payloadFile = Join-Path $env:RUNNER_TEMP 'feed-update.json'
          [IO.File]::WriteAllText($payloadFile, ($payload | ConvertTo-Json -Compress), [Text.UTF8Encoding]::new($false))
          gh api --method PUT $endpoint --input $payloadFile --silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: kupopop-testing-release
          path: |
            artifacts/testing.zip
            artifacts/repo.json
            artifacts/Kupopop.Server-*.zip
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run server tests on Linux
        run: |
          dotnet build server/Kupopop.Tests/Kupopop.Tests.csproj -c Release
          dotnet server/Kupopop.Tests/bin/Release/net10.0/Kupopop.Tests.dll
          bash -n server/hosting/start-server.sh server/hosting/start-local.sh
